name: "CDK Deploy"
description: "Reusable action to deploy CDK stacks"
inputs:
  aws-access-key-id:
    description: "AWS Access Key"
    required: true
  aws-secret-access-key:
    description: "AWS Secret Key"
    required: true
  aws-region:
    description: "AWS Region"
    required: true
  env:
    description: "Environment (dev/stg/prod)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        npm install -g aws-cdk
        python -m pip install -r requirements-cdk.txt
      shell: bash

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - name: CDK Synth
      run: cdk synth -c env=${{ inputs.env }}
      shell: bash

    - name: CDK Deploy
      run: cdk deploy llm-${{ inputs.env }}-metadata-scraper -c env=${{ inputs.env }} --require-approval never
      shell: bash
