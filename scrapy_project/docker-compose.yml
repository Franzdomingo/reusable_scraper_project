version: '3.8'

services:
  scraper:
    build:
      context: ..
      dockerfile: scrapy_project/Dockerfile
    image: llm-metadata-scraper
    container_name: llm-scraper
    volumes:
      # Mount output directory to persist scraped data
      - ./output:/app/output
      # Mount api_output directory to persist API data
      - ../api_output:/app/api_output
    environment:
      # Selenium environment variables
      - DISPLAY=:99
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
    command: python run.py
    # For running specific spiders, override the command:
    # docker-compose run scraper python run.py kaggle_links -a max_pages=10

  # Service for running individual spiders
  kaggle-links:
    build:
      context: ..
      dockerfile: scrapy_project/Dockerfile
    image: llm-metadata-scraper
    container_name: kaggle-links-scraper
    volumes:
      - ./output:/app/output
      - ../api_output:/app/api_output
    environment:
      - DISPLAY=:99
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
    command: python run.py kaggle_links -a max_pages=100
    profiles:
      - individual

  kaggle-metadata:
    build:
      context: ..
      dockerfile: scrapy_project/Dockerfile
    image: llm-metadata-scraper
    container_name: kaggle-metadata-scraper
    volumes:
      - ./output:/app/output
      - ../api_output:/app/api_output
    environment:
      - DISPLAY=:99
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
    command: python run.py kaggle_metadata
    profiles:
      - individual

  nvidia-models:
    build:
      context: ..
      dockerfile: scrapy_project/Dockerfile
    image: llm-metadata-scraper
    container_name: nvidia-models-scraper
    volumes:
      - ./output:/app/output
      - ../api_output:/app/api_output
    environment:
      - DISPLAY=:99
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
    command: python run.py nvidia_models
    profiles:
      - individual

  # Service for running Kaggle API list models command
  kaggle-api-list:
    build:
      context: ..
      dockerfile: scrapy_project/Dockerfile
    image: llm-metadata-scraper
    container_name: kaggle-api-list
    volumes:
      - ../api_output:/app/api_output
      - ~/.kaggle:/root/.kaggle:ro
    environment:
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    command: python -m api.kaggle_api --page-size=20 --max-pages=5 --output=kaggle_models.json
    profiles:
      - api

  # Service for running Kaggle API fetch from CSV command
  kaggle-api-csv:
    build:
      context: ..
      dockerfile: scrapy_project/Dockerfile
    image: llm-metadata-scraper
    container_name: kaggle-api-csv
    volumes:
      - ../api_output:/app/api_output
      - ~/.kaggle:/root/.kaggle:ro
    environment:
      - KAGGLE_USERNAME=${KAGGLE_USERNAME}
      - KAGGLE_KEY=${KAGGLE_KEY}
    command: python -m api.kaggle_api --input-csv=/app/api_output/input.csv --output=models.json
    profiles:
      - api
